<head>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">Solitude of Mechanics</a>
        <button class="nav-toggle" onclick="toggleNav()">Menu</button>
        <ul class="nav-links" id="navLinks">
            <button class="nav-close" onclick="toggleNav()">Close</button>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="essays.html">Essays</a></li>
            <li><a href="manufacturers.html">Manufacturers</a></li>
            <li><a href="about.html">About</a></li>
        </ul>

    <section class="hero">
        <!-- Replace with edge-to-edge watch photograph -->
        <div class="hero__image hero__image--placeholder"></div>

        <div class="hero__caption">
            <p>A private study of watchmaking</p>
        </div>
    </section>

    <footer>

        <span class="footer-right"><a href="https://instagram.com/solitudeofmechanics" target="_blank" rel="noopener">@solitudeofmechanics</a></span>
    </footer>

    <script>
    function toggleNav() {
        document.getElementById('navLinks').classList.toggle('open');
    }

    // Scroll-aware nav background
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const nav = document.querySelector('nav');
        if (window.scrollY > 60) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });
    </script>

</body>
